name: flutter_aepoptimize

description: Official Adobe Experience Platform support for Flutter apps. The Optimize extension enables real-time personalization using Adobe Target and Offer Decisioning.
version: 5.0.0
homepage: https://developer.adobe.com/client-sdks
repository: https://github.com/adobe/aepsdk_flutter/tree/main/plugins/flutter_aepoptimize

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_aepcore: ">=5.0.0 <6.0.0"
  flutter_aepedge: ">=5.0.0 <6.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.adobe.marketing.mobile.flutter.flutter_aepoptimize
        pluginClass: FlutterAEPOptimizePlugin
      ios:
        pluginClass: FlutterAEPOptimizePlugin
